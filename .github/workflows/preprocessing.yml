name: Preprocessing

concurrency:
    group: preprocessing
    cancel-in-progress: true

on:
    push:
        branches: [main]
        paths:
            - "preprocessing/**.py"
            - "pyproject.toml"
            - "uv.lock"
            - ".github/workflows/preprocessing.yml"
    workflow_dispatch:

jobs:
    preprocess:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up uv
              uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
              with:
                enable-cache: true

            - name: Install dependencies
              run: uv sync --locked --no-dev

            - name: Run preprocessing
              run: uv run python preprocessing/preprocessing.py

            - name: Commit preprocessed data
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git add preprocessing/data_preprocessing/
                git diff --staged --quiet || git commit -m "chore: update preprocessed data"
                git push
